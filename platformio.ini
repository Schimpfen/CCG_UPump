
; PlatformIO Project Configuration File

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = 
    -I include

lib_deps = 
    WiFi                      ; Essential for WiFi functionalities
    NTPClient                 ; For NTP time synchronization
    ArduinoJson@^6.18.5       ; For JSON parsing
    me-no-dev/AsyncTCP@^1.1.1 ; Correct AsyncTCP library for ESP32
    EEPROM                    ; For EEPROM functionality
    Wire                      ; I2C
    https://github.com/me-no-dev/ESPAsyncWebServer.git # Async web server library
    bblanchon/ArduinoJson